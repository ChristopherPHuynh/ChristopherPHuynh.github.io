<!DOCTYPE html>
<html>
<head>
    <title>Player Data Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9fafb;
            color: #333;
        }

        h1 {
            margin-bottom: 10px;
        }

        select {
            padding: 8px;
            margin-bottom: 20px;
        }

        .table-container {
            overflow-x: auto;
            border: 1px solid #ddd;
            background: white;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 800px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        th {
            background-color: #2563eb;
            color: white;
            cursor: pointer;
        }

        th:hover {
            background-color: #1d4ed8;
        }

        tr:nth-child(even) {
            background-color: #f3f4f6;
        }
    </style>
</head>
<body>

    <h1>Player Data Dashboard</h1>

    <p>Select a column to sort by:</p>
    <select id="sortSelect"></select>

    <div class="table-container">
        <table id="dataTable"></table>
    </div>

    <script>
        let tableData = [];
        let headers = [];

        // 👇 ONLY KEEP IMPORTANT COLUMNS (EDIT THESE)
        const allowedColumns = [
            "Name",
            "team",
            "position",
            "age",
            "height",
            "weight",
            "Socioeconomic_Score",
            "Environmental_Score",
            "ResourceAccess_Score",
            "Physical_Score",
            "Underrated_Score"
        ];

        fetch("player_data.csv")
            .then(response => response.text())
            .then(data => {
                const rows = data.split("\n").map(row => row.split(","));

                const rawHeaders = rows[0];

                // Get indices of allowed columns
                const indices = rawHeaders
                    .map((h, i) => allowedColumns.includes(h.trim()) ? i : -1)
                    .filter(i => i !== -1);

                headers = indices.map(i => rawHeaders[i]);

                tableData = rows.slice(1).map(row =>
                    indices.map(i => row[i])
                );

                populateDropdown();
                renderTable();
            });

        function populateDropdown() {
            const select = document.getElementById("sortSelect");

            headers.forEach((header, index) => {
                const option = document.createElement("option");
                option.value = index;
                option.textContent = header;
                select.appendChild(option);
            });

            select.addEventListener("change", () => {
                sortTable(select.value);
            });
        }

        function sortTable(colIndex) {
            tableData.sort((a, b) => {
                const valA = parseFloat(a[colIndex]) || a[colIndex];
                const valB = parseFloat(b[colIndex]) || b[colIndex];

                if (valA < valB) return -1;
                if (valA > valB) return 1;
                return 0;
            });

            renderTable();
        }

        function renderTable() {
            const table = document.getElementById("dataTable");
            table.innerHTML = "";

            const headerRow = document.createElement("tr");
            headers.forEach(header => {
                const th = document.createElement("th");
                th.textContent = header;
                headerRow.appendChild(th);
            });
            table.appendChild(headerRow);

            tableData.forEach(row => {
                const tr = document.createElement("tr");

                row.forEach(cell => {
                    const td = document.createElement("td");
                    td.textContent = cell;
                    tr.appendChild(td);
                });

                table.appendChild(tr);
            });
        }
    </script>

</body>
</html>
