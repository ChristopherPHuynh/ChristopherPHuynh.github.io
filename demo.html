<!DOCTYPE html>
<html>
<head>
    <title>Data Visualization Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9fafb;
            color: #333;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            cursor: pointer;
            background-color: #2563eb;
            color: white;
        }

        th:hover {
            background-color: #1d4ed8;
        }

        select {
            padding: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Player Data Dashboard</h1>

    <p>Select a column to sort by:</p>

    <select id="sortSelect"></select>

    <table id="dataTable"></table>

    <script>
        let tableData = [];
        let headers = [];

        // Load CSV file
        fetch("player_data.csv")
            .then(response => response.text())
            .then(data => {
                const rows = data.split("\n").map(row => row.split(","));

                headers = rows[0];
                tableData = rows.slice(1);

                populateDropdown();
                renderTable();
            });

        function populateDropdown() {
            const select = document.getElementById("sortSelect");

            headers.forEach((header, index) => {
                const option = document.createElement("option");
                option.value = index;
                option.textContent = header;
                select.appendChild(option);
            });

            select.addEventListener("change", () => {
                sortTable(select.value);
            });
        }

        function sortTable(colIndex) {
            tableData.sort((a, b) => {
                const valA = isNaN(a[colIndex]) ? a[colIndex] : parseFloat(a[colIndex]);
                const valB = isNaN(b[colIndex]) ? b[colIndex] : parseFloat(b[colIndex]);

                if (valA < valB) return -1;
                if (valA > valB) return 1;
                return 0;
            });

            renderTable();
        }

        function renderTable() {
            const table = document.getElementById("dataTable");
            table.innerHTML = "";

            // Header row
            const headerRow = document.createElement("tr");
            headers.forEach(header => {
                const th = document.createElement("th");
                th.textContent = header;
                headerRow.appendChild(th);
            });
            table.appendChild(headerRow);

            // Data rows
            tableData.forEach(row => {
                const tr = document.createElement("tr");

                row.forEach(cell => {
                    const td = document.createElement("td");
                    td.textContent = cell;
                    tr.appendChild(td);
                });

                table.appendChild(tr);
            });
        }
    </script>

</body>
</html>
