<!DOCTYPE html>
<html>
<head>
    <title>CSV Test</title>
</head>
<body>

<h1>CSV Debug Test</h1>

<p id="status">Loading...</p>

<script>
fetch("player_data.csv")
    .then(response => {
        if (!response.ok) {
            throw new Error("File not found");
        }
        return response.text();
    })
    .then(data => {
        document.getElementById("status").innerText = "CSV loaded successfully ✅";

        console.log("CSV CONTENT:");
        console.log(data);

        alert("CSV loaded successfully!");
    })
    .catch(error => {
        document.getElementById("status").innerText = "ERROR loading CSV ❌";
        console.error(error);
        alert("Error loading CSV");
    });
</script>

</body>
</html>
