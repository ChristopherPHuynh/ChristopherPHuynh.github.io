<!DOCTYPE html>
<html>
<head>
    <title>Player Data Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9fafb;
        }

        h1 {
            margin-bottom: 20px;
        }

        .table-container {
            overflow-x: auto;
            border: 1px solid #ccc;
            background: white;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 800px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #2563eb;
            color: white;
            cursor: pointer;
        }

        th:hover {
            background-color: #1d4ed8;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

<h1>Player Data Dashboard</h1>
<p>Click any column header to sort</p>

<div class="table-container">
    <table id="csvTable"></table>
</div>

<script>
let tableData = [];
let headers = [];
let sortDirection = {}; // track asc/desc

fetch("player_data.csv")
    .then(response => response.text())
    .then(data => {
        const rows = data.trim().split("\n").map(row => row.split(","));

        headers = rows[0];
        tableData = rows.slice(1);

        renderTable();
    });

function renderTable() {
    const table = document.getElementById("csvTable");
    table.innerHTML = "";

    // Header row
    const headerRow = document.createElement("tr");

    headers.forEach((header, colIndex) => {
        const th = document.createElement("th");
        th.textContent = header;

        th.addEventListener("click", () => sortTable(colIndex));

        headerRow.appendChild(th);
    });

    table.appendChild(headerRow);

    // Data rows
    tableData.forEach(row => {
        const tr = document.createElement("tr");

        row.forEach(cell => {
            const td = document.createElement("td");
            td.textContent = cell;
            tr.appendChild(td);
        });

        table.appendChild(tr);
    });
}

function sortTable(colIndex) {
    // toggle direction
    sortDirection[colIndex] = !sortDirection[colIndex];

    tableData.sort((a, b) => {
        const valA = parseFloat(a[colIndex]);
        const valB = parseFloat(b[colIndex]);

        return sortDirection[colIndex] ? valA - valB : valB - valA;
    });

    renderTable();
}
</script>

</body>
</html>
